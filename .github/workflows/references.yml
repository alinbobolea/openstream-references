name: references

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2026b
          cache: true
      - uses: matlab-actions/run-tests@v3
        with:
          source-folder: matlab
          select-by-folder: tests
